{% extends "base.html" %}
{% block content %}
<form method="post" action="{{ url_for('log') }}">
  <label class="datebar">Logging for <input type="date" name="date" id="logdate" value="{{ date }}" {% if fixed %}data-fixed="1"{% endif %} required></label>
  {% if not categories %}<p class="empty">No categories yet. Create one, then tap it to log.</p>{% endif %}
  <ul class="items">
  {% for c in categories %}
    <li>
      <button type="submit" name="category_id" value="{{ c.id }}" class="item" style="--c: {{ c.color }}">
        <span class="icon">{{ c.icon }}</span>
        <span class="text"><span class="name">{{ c.name }}</span>{% if c.note %}<span class="note">{{ c.note }}</span>{% endif %}</span>
        <span class="count">{{ c.count }}</span>
      </button>
      <a class="edit" href="{{ url_for('edit_category', category_id=c.id) }}" aria-label="Edit category">✎</a>
    </li>
  {% endfor %}
  </ul>
</form>
<a class="btn primary" href="{{ url_for('new_category') }}">+ New category</a>
{% endblock %}
{% block scripts %}
<script>
// Default the date to the phone's local "today"; the server may sit in another timezone.
(function () {
  var el = document.getElementById('logdate');
  if (!el || el.dataset.fixed) return;
  var d = new Date();
  el.value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
})();
</script>
{% endblock %}
